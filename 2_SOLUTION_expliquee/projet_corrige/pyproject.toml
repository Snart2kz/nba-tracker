[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-tracker"
version = "0.1.0"
description = "Mini tracker de stats basket (exercice Python fondations)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.10", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
include = ["nba_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
